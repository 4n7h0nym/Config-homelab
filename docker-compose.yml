 services:

  db:
    image: mariadb:10.11
    container_name: nextcloud-db
    command: --transaction-isolation=READ-COMMITTED --log-bin-trust-function-creators=1
    volumes:
      - ./db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: 'Groscaca-2'
      MYSQL_PASSWORD: 'Groscaca-2'
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
    restart: unless-stopped

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"
    environment:
      TZ: 'America/Toronto'
      WEBPASSWORD: 'toto1234'
    volumes:
      - ./pihole/etc-pihole:/etc/pihole
      - ./pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    restart: unless-stopped

  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    ports:
      - "8081:80"
    volumes:
      - ./nextcloud/html:/var/www/html
      - /var/nextcloud_data:/var/www/html/data
    environment:
      MYSQL_PASSWORD: 'Groscaca-2'
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_HOST: db
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer/data:/data
    restart: unless-stopped

  immich-frame:
    image: ghcr.io/immichframe/immichframe:latest
    container_name: immich-frame
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ImmichServerUrl=http://192.168.1.91:2283
      - ApiKey=RP3Pjcbp4ou78utZSTE0TjESZr2XZhQs1q0lwdi9Ik
      - Albums=64a55e19-7fd1-4865-9793-708395cd2326
      - Interval=10
